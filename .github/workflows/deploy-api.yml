name: Deploy API Lambda to ECR

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-api.yml'
      - 'app/**'
      - 'Dockerfile.api.onnx'
      - 'requirements-api-onnx.txt'
      - 'deployment-helpers/**'

env:
  AWS_REGION: 'eu-central-1'
  ECR_REPOSITORY_API: 'developer-archives-api'
  LAMBDA_FUNCTION_NAME_API: 'developer-archives-api'

jobs:
  deploy-api:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # --- OPTIMIZED BUILD STEP ---
    - name: Build and push to ECR with Cache
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.api.onnx
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}
        platforms: linux/arm64
        # Important for Lambda: Disable provenance to avoid manifest errors
        provenance: false
        # The Magic Part: Use GitHub Actions Cache
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Lambda function code
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_API }} \
          --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}

  # (Keep your e2e-test job here as is)
  e2e-test:
    name: Run E2E Tests on Deployed API
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install E2E Test Dependencies
      run: pip install -r requirements-test.txt
    - name: Warm up and Test
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
      run: |
        curl -m 10 "${{ env.API_BASE_URL }}/" || true
        sleep 30
        pytest tests/e2e/api_test.py