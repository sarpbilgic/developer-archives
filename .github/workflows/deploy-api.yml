name: Deploy API Lambda to ECR

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-api.yml'
      - 'app/main.py'
      - 'app/api/routes/**'
      - 'app/schemas/**'
      - 'app/data_access/repositories/repository_detail.py'
      - 'app/data_access/repositories/search_repository.py'
      - 'app/db.py'
      - 'app/settings.py'
      - 'app/external/embedding_client.py'
      - 'Dockerfile.api'
      - 'requirements-api.txt'
      - 'requirements-test.txt' 
      - 'tests/e2e/api_test.py' 
      - 'deployment-helpers/download_model.py'

      

env:
  AWS_REGION: 'eu-central-1'
  ECR_REPOSITORY_API: 'developer-archives-api'
  LAMBDA_FUNCTION_NAME_API: 'developer-archives-api'

jobs:
  deploy-api:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    environment: env

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        # --- FIX: Corrected typo from aws-secret-key ---
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, cache, and push image to Amazon ECR
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.api
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}
        platforms: linux/arm64

        cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:buildcache
        cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:buildcache,mode=max

    - name: Set image_uri output
      id: set-output
      run: echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Update Lambda function code
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_API }} \
          --image-uri ${{ steps.set-output.outputs.image_uri }} 
          
  e2e-test:
    name: Run E2E Tests on Deployed API
    runs-on: ubuntu-latest
    needs: deploy-api
    environment: env

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install E2E Test Dependencies
      run: |
        # Install ONLY the E2E test dependencies (httpx, pytest)
        pip install -r requirements-test.txt

    - name: Warm up Lambda Endpoint
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
      run: |
        echo "Sending warm-up request to ${{ env.API_BASE_URL }}/"
        # This will likely time out or fail, but that's OK.
        # We use 'curl -m 10 ... || true' to trigger the cold start and ignore failure.
        curl -m 10 "${{ env.API_BASE_URL }}/" || true
        
        echo "Waiting 30 seconds for Lambda to finish cold start..."
        sleep 30


    - name: Run E2E Tests
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL}}
      run: |
        # Run the E2E tests against the public URL
        pytest tests/e2e/api_test.py