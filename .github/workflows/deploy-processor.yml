name: Deploy Processor Lambda to ECR

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-processor.yml'
      - 'app/**'
      - 'Dockerfile.processor.onnx'
      - 'requirements-processor-onnx.txt'
      - 'deployment-helpers/**'

env:
  AWS_REGION: 'eu-central-1'
  ECR_REPOSITORY_PROCESSOR: 'developer-archives-processor' 
  LAMBDA_FUNCTION_NAME_PROCESSOR: 'developer-archives-processor'

jobs:
  deploy-processor:
    name: Build and Deploy Processor
    runs-on: ubuntu-latest
    # REMOVED: environment: env (Fixes credentials)

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # --- FAST BUILD + MANIFEST FIX ---
    - name: Build and push to ECR with Cache
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.processor.onnx
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PROCESSOR }}:${{ github.sha }}
        platforms: linux/arm64
        # FIXES MANIFEST ERROR
        provenance: false
        # ENABLE CACHING
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Lambda function code
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_PROCESSOR }} \
          --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PROCESSOR }}:${{ github.sha }}