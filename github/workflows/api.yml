name: Deploy API Lambda to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'app/main.py'
      - 'app/api/routes/**'
      - 'app/schemas/**'
      - 'app/data_access/repositories/repository_detail.py'
      - 'app/data_access/repositories/search_repository.py'
      - 'app/db.py'
      - 'app/settings.py'
      - 'app/external/embedding_client.py'
      - 'Dockerfile.api'
      - 'requirements-api.txt'
      - 'requirements-test.txt' 
      - 'tests/e2e/api_test.py' 

env:
  AWS_REGION: 'eu-central-1'
  ECR_REPOSITORY_API: 'developer-archives-api'
  LAMBDA_FUNCTION_NAME_API: 'developer-archives-api'

jobs:
  deploy-api:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    environment: env

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -f Dockerfile.api .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
        echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Update Lambda function code
      run: |
        aws lambda update-function-code \
          --function-name ${{ env.LAMBDA_FUNCTION_NAME_API }} \
          --image-uri ${{ steps.build-image.outputs.image_uri }}
          
  e2e-test:
    name: Run E2E Tests on Deployed API
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install E2E Test Dependencies
      run: |
        # Install ONLY the E2E test dependencies (httpx, pytest)
        pip install -r requirements-e2e.txt

    - name: Run E2E Tests
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
      run: |
        # Run the E2E tests against the public URL
        pytest tests_e2e/test_api_endpoints.py